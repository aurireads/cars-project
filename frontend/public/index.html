<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="WS Work Cars - Sistema de Gerenciamento de Veículos"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Meta tags para SEO -->
    <meta name="author" content="WS Work Cars" />
    <meta name="keywords" content="carros, veículos, gerenciamento, FastAPI, React" />
    
    <!-- Preload de fontes para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <title>WS Work Cars - Gerenciamento de Veículos</title>
    
    <style>
      /* Loading inicial para melhor UX */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      #loading h3 {
        color: #1e293b;
        margin: 0 0 0.5rem 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      
      #loading p {
        color: #64748b;
        margin: 0;
        font-size: 0.875rem;
      }
      
      /* Esconder loading quando React carregar */
      .app-loaded #loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h2>🚫 JavaScript Necessário</h2>
        <p>Você precisa habilitar o JavaScript para executar esta aplicação.</p>
        <p>This app requires JavaScript to run properly.</p>
      </div>
    </noscript>
    
    <!-- Loading inicial -->
    <div id="loading">
      <div class="spinner"></div>
      <h3>🚗 WS Work Cars</h3>
      <p>Carregando aplicação...</p>
    </div>
    
    <!-- Container onde o React será montado -->
    <div id="root"></div>
    
    <script>
      // Remover loading quando React carregar
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.body.classList.add('app-loaded');
        }, 100);
      });
      
      // Fallback para remover loading após 5 segundos
      setTimeout(function() {
        document.body.classList.add('app-loaded');
      }, 5000);
    </script>
  </body>
</html>
