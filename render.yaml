services:
  - type: web
    name: cars-project
    runtime: python3
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cars-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: cars-db
    databaseName: cars_project
    user: cars_user